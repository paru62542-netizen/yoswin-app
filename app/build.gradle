plugins {
    id 'com.android.application'
}

// Site ka link site-url.txt se aata hai (sirf ek line)
def siteUrl = file('../site-url.txt').text.trim()
if (siteUrl.contains('CHANGE-ME') || !siteUrl.startsWith('https://')) {
    throw new GradleException('site-url.txt me apni site ka poora link daalo, jaise https://xxxx.up.railway.app')
}

android {
    namespace 'com.yoswin.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yoswin.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        resValue 'string', 'site_url', siteUrl
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
